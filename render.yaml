# Render Blueprint for a free test deploy (render.com > New > Blueprint > pick this repo).
# Free web services sleep after 15 minutes without visitors and reset their disk on restart, so the
# app ships with a snapshot of the laptop's database (npm run snapshot -w server) and keeps
# collecting while awake. Delete the service in Render's dashboard when the test is over.
services:
  - type: web
    name: bloomington-bus
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DB_PATH
        value: data/snapshot/bus.sqlite
      - key: COLLECT
        value: "true"
